name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: pip install -r requirements-dev.txt

      - name: Запустить тесты
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Собрать Docker-образ
        run: docker build -t healthcheck .

      - name: Запустить контейнер и проверить ответ
        run: |
          docker run -d --name hc -p 5000:5000 healthcheck
          sleep 5
          curl --fail http://localhost:5000/api/status
          docker stop hc
