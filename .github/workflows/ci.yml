name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: pip install -r requirements-dev.txt

      - name: Запустить тесты
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Создать .env из шаблона (для одноразовой тестовой базы)
        run: cp .env.example .env

      - name: Поднять сервисы
        run: docker compose up -d --build

      - name: Дождаться данных в API
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5000/api/status | grep -q '"url"'; then
              echo "Данные появились"
              curl -s http://localhost:5000/api/status
              exit 0
            fi
            sleep 2
          done
          echo "Данных нет, логи сервисов:"
          docker compose logs
          exit 1

      - name: Остановить сервисы
        if: always()
        run: docker compose down -v

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Войти в реестр GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Собрать и отправить образ
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${GITHUB_SHA::7}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"
